version: "3.8"

services:
  # Ollama - already running on host with AMD GPU support
  # The host Ollama (ollama serve) uses /dev/kfd and /dev/dri for AMD GPU
  # No need to run Ollama in Docker - use host's Ollama with GPU
  
  # Main application - Streamlit UI + Agent
  rag-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-app
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - OLLAMA_HOST=host.docker.internal:11434  # Connect to host Ollama (AMD GPU)
      - OLLAMA_MODEL=glm4:9b
      - STREAMLIT_SERVER_PORT=8501
    volumes:
      - .:/app
      - /home/columbo/ExtData/AIprojects/RagDemo/data:/app/data:ro
    networks:
      - rag-network
    deploy:
      resources:
        limits:
          memory: 2G
    entrypoint: >
      sh -c "
      echo 'Waiting for host Ollama to be ready...'
      while ! curl -s http://host.docker.internal:11434/api/tags > /dev/null 2>&1; do
        sleep 2
      done
      echo 'Ollama is ready! Starting Streamlit...'
      streamlit run ui/app.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true
      "

# Optional: Load test service
#  load-test:
#    build: .
#    container_name: rag-load-test
#    environment:
#      - OLLAMA_HOST=host.docker.internal:11434
#    volumes:
#      - .:/app
#    entrypoint: python tests/load_test.py

networks:
  rag-network:
    driver: bridge
